name: CI

# 这个工作流存在的唯一理由：拦住「本地一切正常、只有导出构建才暴露」的问题。
#
# 已经踩过两次同类坑：
#   1. pnpm-workspace.yaml 里 allowBuilds 写了占位字符串，本地因为
#      node_modules 已存在从不重跑安装脚本，一到 Cloudflare 就
#      ERR_PNPM_IGNORED_BUILDS。
#   2. site-logo.tsx 用了 next/image，dev 有服务端所以正常，
#      静态导出后 /_next/image 路由不存在，线上 logo 直接 404。
#
# 两次的共同点：本地开发环境的额外能力掩盖了生产环境的缺失。
# 所以这里刻意用「全新安装 + 导出构建」，并在构建后对产物做断言。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支连续推送时取消上一次未跑完的任务，省额度也更快拿到结果
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 版本要和 package.json 的 packageManager 保持一致，
      # 否则 pnpm 会因为两者不匹配而直接报错退出
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          # 对齐 Cloudflare 构建镜像使用的 Node 版本
          node-version: 22
          cache: pnpm

      # --frozen-lockfile：锁文件与 package.json 不一致时直接失败，
      # 避免 CI 上悄悄改动依赖树、掩盖本地漏提交的变更
      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 必须先跑 typegen，否则 typecheck 必然失败。
      #
      # Next.js 把 PageProps / LayoutProps 这类路由类型生成到 .next/types/，
      # 再通过 next-env.d.ts 引入。而 next-env.d.ts 在 .gitignore 里
      # （它是自动生成物），全新克隆的仓库根本没有这个文件，
      # tsc 会报一堆 "Cannot find name 'PageProps'"。
      #
      # 本地看不出来是因为跑过 pnpm dev / pnpm build，生成物还在。
      - name: 生成路由类型
        run: pnpm typegen

      - name: 类型检查
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # functions/ 是 Cloudflare Pages Functions，不进 Next 构建，
      # 所以 typecheck 和 lint 都覆盖不到它——语法错误只会在部署时炸。
      # node --check 只做语法解析，毫秒级，不引入任何依赖。
      - name: Functions 语法检查
        run: |
          set -e
          count=0
          for f in $(find functions -name '*.js'); do
            node --check "$f"
            count=$((count + 1))
          done
          echo "已检查 $count 个 Functions 文件"

      # 必须带 NEXT_OUTPUT=export，否则测的是本地构建路径，
      # 而不是真实上线的那条路径——那 CI 就失去意义了。
      # basePath 按仓库名自动派生，与 pages.yml 的生产构建保持同源。
      - name: 静态导出构建
        run: NEXT_OUTPUT=export GITHUB_PAGES=true NEXT_PUBLIC_BASE_PATH=/${{ github.event.repository.name }} pnpm build

      - name: 校验导出产物
        run: |
          set -uo pipefail

          fail() { echo "::error::$1"; exit 1; }
          ok()   { echo "✅ $1"; }

          # ---- 基础产物 ----
          [ -f out/index.html ]  || fail "缺少 out/index.html"
          [ -f out/404.html ]    || fail "缺少 out/404.html（Cloudflare Pages 靠它做自定义 404）"
          [ -f out/sitemap.xml ] || fail "缺少 out/sitemap.xml"
          [ -f out/robots.txt ]  || fail "缺少 out/robots.txt"
          ok "首页 / 404 / sitemap / robots 均存在"

          # ---- 404 必须是我们自己的页面 ----
          # Next 自带一个只有英文 "This page could not be found." 的默认 404。
          # 一旦 src/app/not-found.tsx 被删或失效，构建不会报错，
          # 但访客会突然看到那个英文页——所以在这里断言内容。
          grep -q "这个页面不存在" out/404.html \
            || fail "out/404.html 不是自定义 404（src/app/not-found.tsx 可能失效了）"
          ok "自定义 404 已生成"

          # ---- sitemap 必须真有 URL，空 sitemap 说明 siteConfig.url 没配 ----
          grep -q "<loc>" out/sitemap.xml \
            || fail "sitemap.xml 里没有 <loc>，检查 lib/site.ts 的 siteConfig.url 是否为空"
          ok "sitemap 含 $(grep -c '<loc>' out/sitemap.xml) 条 URL"

          # ---- trailingSlash：文章页必须是目录形式 ----
          # 目录形式是 /blog/x/index.html，平铺形式是 /blog/x.html。
          # 后者需要在每个静态托管端单独配 rewrite，加国内 CDN 镜像时会踩坑。
          [ -f out/blog/index.html ] \
            || fail "文章列表不是目录形式，trailingSlash 可能失效"
          post_count=0
          for d in out/blog/*/; do
            [ -d "$d" ] || continue
            case "$d" in
              */__next*) continue ;; # Next 内部 RSC 产物目录
              # 这两个是 /blog 下的嵌套路由，不是文章详情页：它们的
              # index.html 在更深一层（archive/[month]/、page/[n]/），
              # 直接检查当前层会误报「缺少 index.html」。
              */archive/) continue ;;
              */page/)    continue ;;
            esac
            [ -f "$d/index.html" ] \
              || fail "文章页缺少 index.html（trailingSlash 可能失效）：$d"
            post_count=$((post_count + 1))
          done
          [ "$post_count" -gt 0 ] || fail "没有生成任何文章详情页"
          ok "文章页为目录形式（$post_count 篇，trailingSlash 生效）"

          # ---- 标签页必须生成 ----
          # 判定标准是「真的产出了 index.html」，而不是数目录个数。
          # out/tags/ 下还有 __next.tags 这类 Next 内部 RSC 产物目录，
          # 它不是页面；而且它在不同平台上可能是文件也可能是目录，
          # 直接 ls -d out/tags/*/ | wc -l 会得到不稳定的数字。
          tag_count=0
          for d in out/tags/*/; do
            [ -d "$d" ] || continue
            case "$d" in */__next*) continue ;; esac
            [ -f "$d/index.html" ] || fail "标签页缺少 index.html：$d"
            tag_count=$((tag_count + 1))
          done
          [ "$tag_count" -gt 0 ] || fail "没有生成任何标签详情页"
          ok "标签页已生成 $tag_count 个，且都有 index.html"

          # ---- 关键回归断言：next/image 的优化器引用 ----
          # next/image 默认会输出 /_next/image?url=... 指向服务端优化接口，
          # 静态产物里没有这个路由，图片会静默 404（顶栏 logo 就是这么丢的）。
          # 一旦有人新增 next/image 用法而忘了 images.unoptimized，这里会拦住。
          #
          # 匹配串带上 ?url=，不能只搜 "_next/image"：
          # 文章正文里讨论这个坑时会原样写出 /_next/image 这几个字
          #（3-code-blocks-guide 就是），只搜路径会把正常内容误判成回归。
          # 优化器生成的 URL 一定带 ?url=，所以这个写法既准又不会漏。
          if grep -rqE '_next/image\?url=' out --include="*.html"; then
            echo "::error::产物中出现了 /_next/image 引用，静态导出下该路由不存在，图片会 404"
            grep -rlE '_next/image\?url=' out --include="*.html" | head -5
            exit 1
          fi
          ok "无 /_next/image 引用（图片优化器已按要求关闭）"

          # ---- 关键回归断言：表格必须被 table-scroll 包裹 ----
          # .prose table 的 width:100% 只是期望宽度，表格不会收缩到
          # min-content 以下；某一列内容一长就撑破正文列，在窄屏上引发
          # 整页横向溢出，表现为顶栏和阅读进度条右侧「断开」。
          #
          # 这里做的是静态等价检查：产出的每个 <table> 都要有配对的
          # table-scroll 容器。纯 grep，毫秒级，不需要跑浏览器——
          # 它拦不住所有溢出形态（比如超长 URL），但正好覆盖已发生的这个。
          table_total=$(grep -ro '<table' out --include="*.html" | wc -l)
          table_wrapped=$(grep -ro '<div class="table-scroll">' out --include="*.html" | wc -l)
          if [ "$table_total" -ne "$table_wrapped" ]; then
            echo "::error::有 $((table_total - table_wrapped)) 个 <table> 未包裹 table-scroll，窄屏会整页横向溢出"
            echo "检查 src/mdx-components.tsx 的 table 映射是否仍然生效"
            exit 1
          fi
          ok "表格均已包裹横向滚动容器（$table_total 个）"

          # ---- public/ 资源要复制进产物 ----
          [ -f out/background-light.png ] || fail "background-light.png 未复制到产物，站点背景会缺失"
          ok "public/ 资源已复制"

          echo "---- 产物统计 ----"
          echo "HTML 页面：$(find out -name '*.html' | wc -l)"
          echo "文件总数：$(find out -type f | wc -l)"
